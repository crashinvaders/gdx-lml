buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:7.4.2"
    }
}

allprojects {
    repositories {
        mavenLocal()
        mavenCentral()
        google()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
    }

    ext {
        projectGroup = 'com.crashinvaders.lml'
        projectVersion = '1.10'
        gdxVersion = '1.14.2'
        isSnapshot = false
        libVersion = "$projectVersion.$gdxVersion${isSnapshot ? '-SNAPSHOT' : ''}"
    }
}

/** Checks if the property exists and if not tries to resolve it from the environment variable. */
void resolveProperty(String propertyName, String envVariableName) {
    if (!project.hasProperty(propertyName)) {
        def value = System.getenv(envVariableName)
        if (!value) {
            println "$propertyName is not defined"
        } else {
            project.ext.set(propertyName, value)
            println "$propertyName has been set from an environment variable."
        }
    }
}
// Setup Central Portal user-token credentials. Define these in the user-level
// Gradle properties file or provide OSSRH_USERNAME and OSSRH_PASSWORD.
// The property names are retained for compatibility with existing local setup.
resolveProperty('ossrhUsername', 'OSSRH_USERNAME')
resolveProperty('ossrhPassword', 'OSSRH_PASSWORD')

def libAndroidModules = [ project(':autumn:natives:android') ]
def libJavaModules = subprojects - project(':autumn:natives') - project(':autumn:natives:desktop') - project(':websocket:natives') - libAndroidModules
def allLibModules = libJavaModules + libAndroidModules

configure(libJavaModules) {
    apply plugin: 'java-library'

    sourceCompatibility = 8.0
    targetCompatibility = 8.0

    archivesBaseName = projectName

    ext {
        junitVersion = '4.12'
    }

    dependencies {
        compileOnly "com.badlogicgames.gdx:gdx:$gdxVersion"
        testImplementation "com.badlogicgames.gdx:gdx:$gdxVersion"
        testImplementation "junit:junit:$junitVersion"
    }

    jar {
        from project.sourceSets.main.output
        from(project.sourceSets.main.allSource) {
            include '**/*.xml'
        }
        baseName = archivesBaseName
        duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    }

    task sourcesJar(type: Jar) {
        archiveClassifier.set('sources')
        from sourceSets.main.allSource
    }

    task javadocJar(type: Jar) {
        archiveClassifier.set('javadoc')
        from javadoc.destinationDir
    }

    java {
        withJavadocJar()
        withSourcesJar()
    }
}

configure(libAndroidModules) {
    apply plugin: 'com.android.library'

    android {
        compileSdk = 30
        buildToolsVersion = '30.0.3'

        defaultConfig {
            minSdkVersion 14
        }

        compileOptions {
            sourceCompatibility = JavaVersion.VERSION_1_8
            targetCompatibility = JavaVersion.VERSION_1_8
        }

        sourceSets {
            main {
                manifest.srcFile 'AndroidManifest.xml'
            }
        }

        publishing {
            singleVariant("release") {
                withSourcesJar()
                withJavadocJar()
            }
        }

        packagingOptions {
            // Preventing from license violations (more or less):
            pickFirst 'META-INF/LICENSE.txt'
            pickFirst 'META-INF/LICENSE'
            pickFirst 'META-INF/license.txt'
            pickFirst 'META-INF/LGPL2.1'
            pickFirst 'META-INF/NOTICE.txt'
            pickFirst 'META-INF/NOTICE'
            pickFirst 'META-INF/notice.txt'
            // Excluding unnecessary meta-data:
            exclude 'META-INF/robovm/ios/robovm.xml'
            exclude 'META-INF/DEPENDENCIES.txt'
            exclude 'META-INF/DEPENDENCIES'
            exclude 'META-INF/dependencies.txt'
        }
    }

    configurations {
        runtimeClasspath
    }

    dependencies {
        compileOnly "com.badlogicgames.gdx:gdx:$gdxVersion"
        compileOnly "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    }
}

configure(allLibModules) {
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    group = ext.projectGroup
    version = libVersion

    afterEvaluate { project ->
        // Workaround - Android not having components populated yet.
        afterEvaluate {

            publishing {
                repositories {
                    maven {
                        def urlRelease = 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
                        def urlSnapshot = 'https://central.sonatype.com/repository/maven-snapshots/'
                        url = isSnapshot ? urlSnapshot : urlRelease
                        credentials {
                            username ossrhUsername
                            password ossrhPassword
                        }
                    }
//                    maven {
//                        name = "MavenLocalExplicit"
//                        url = "file://${System.properties['user.home']}/.m2/repository"
//                    }
                }

                publications {
                    mavenJava(MavenPublication) {

                        artifactId = projectName

                        // Most normal java projects.
                        if (components.findByName("java") != null)
                            from components.java

                        // Android.
                        if (components.findByName("release") != null) {
                            from components.release
                        }

//                        versionMapping {
//                            usage('java-api') {
//                                fromResolutionOf('runtimeClasspath')
//                            }
//                            usage('java-runtime') {
//                                fromResolutionResult()
//                            }
//                        }

                        pom {
                            name = projectName
                            description = projectDesc
                            url = 'https://github.com/crashinvaders/gdx-lml'

                            licenses {
                                license {
                                    name = 'The Apache License, Version 2.0'
                                    url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                                }
                            }

                            developers {
                                developer {
                                    id = 'metaphore'
                                    name = 'Anton Chekulaev'
                                    email = 'metaphore@crashinvaders.com'
                                }
                                developer {
                                    id = 'mj'
                                    name = 'MJ'
                                    email = 'john.hervicc@gmail.com'
                                }
                            }

                            scm {
                                connection = 'scm:git:git://github.com:crashinvaders/gdx-lml.git'
                                developerConnection = 'scm:git:git@github.com:crashinvaders/gdx-lml.git'
                                url = 'https://github.com/crashinvaders/gdx-lml'
                            }
                        }
                    }
                }
            }

            signing {
//                required { !isSnapshot && gradle.taskGraph.hasTask("publish") }
                sign publishing.publications.mavenJava
            }

            // Simply using "required" in signing block doesn't work because taskGraph isn't ready yet.
            gradle.taskGraph.whenReady {
                tasks.withType(Sign) {
                    onlyIf { !isSnapshot }
//                    onlyIf { !isSnapshot && gradle.taskGraph.hasTask("publish") }
                }
            }
        }
    }

    // Invokes publish task if the version is a snapshot.
    task publishSnapshot() {
        onlyIf { isSnapshot }
        dependsOn project.assemble
        dependsOn project.publish
    }
}

task publishAll {
    group 'gdx-lml'
    description 'Upload all release artifacts to the Central Portal staging API. Does not release them.'

    allLibModules.forEach {project ->
        dependsOn project.build
        dependsOn project.publish
    }
}

task submitReleaseToCentralPortal {
    group 'gdx-lml'
    description 'Submit an uploaded release to the Central Portal. Set -PcentralPublishingType=automatic to release after validation.'

    onlyIf { !isSnapshot }

    doLast {
        def username = findProperty('ossrhUsername')
        def password = findProperty('ossrhPassword')
        if (!username || !password) {
            throw new GradleException('Central Portal user-token credentials are required: ossrhUsername and ossrhPassword.')
        }

        def namespace = projectGroup
        def publishingType = findProperty('centralPublishingType') ?: 'user_managed'
        if (!(publishingType in ['user_managed', 'automatic', 'portal_api'])) {
            throw new GradleException("Unsupported centralPublishingType '${publishingType}'. Use user_managed, automatic, or portal_api.")
        }
        def endpoint = "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/${namespace}?publishing_type=${publishingType}"
        def connection = new URL(endpoint).openConnection() as HttpURLConnection
        def token = "${username}:${password}".getBytes('UTF-8').encodeBase64().toString()
        connection.connectTimeout = 30000
        connection.readTimeout = 30000
        connection.requestMethod = 'POST'
        connection.doOutput = true
        connection.setRequestProperty('Authorization', "Bearer ${token}")
        connection.setRequestProperty('Content-Length', '0')

        def status = connection.responseCode
        def stream = status >= 400 ? connection.errorStream : connection.inputStream
        def response = stream ? stream.getText('UTF-8') : ''
        if (status < 200 || status >= 300) {
            throw new GradleException("Central Portal submission failed (HTTP ${status}): ${response}")
        }
        println "Central Portal ${publishingType} submission accepted for ${namespace}: ${response}"
    }
}

task checkCentralPortalStaging {
    group 'gdx-lml'
    description 'List Central Portal staging repositories for this namespace. Does not modify remote state.'

    doLast {
        def username = findProperty('ossrhUsername')
        def password = findProperty('ossrhPassword')
        if (!username || !password) {
            throw new GradleException('Central Portal user-token credentials are required: ossrhUsername and ossrhPassword.')
        }

        def namespace = projectGroup
        def endpoint = "https://ossrh-staging-api.central.sonatype.com/manual/search/repositories?ip=any&profile_id=${namespace}"
        def connection = new URL(endpoint).openConnection() as HttpURLConnection
        def token = "${username}:${password}".getBytes('UTF-8').encodeBase64().toString()
        connection.connectTimeout = 30000
        connection.readTimeout = 30000
        connection.requestMethod = 'GET'
        connection.setRequestProperty('Authorization', "Bearer ${token}")

        def status = connection.responseCode
        def stream = status >= 400 ? connection.errorStream : connection.inputStream
        def response = stream ? stream.getText('UTF-8') : ''
        if (status < 200 || status >= 300) {
            throw new GradleException("Central Portal staging lookup failed (HTTP ${status}): ${response}")
        }
        println response
    }
}

task dropCentralPortalStaging {
    group 'gdx-lml'
    description 'Delete an open Central Portal staging repository. Requires -PcentralStagingRepositoryKey=<key>.'

    doLast {
        def username = findProperty('ossrhUsername')
        def password = findProperty('ossrhPassword')
        def repositoryKey = findProperty('centralStagingRepositoryKey')
        if (!username || !password) {
            throw new GradleException('Central Portal user-token credentials are required: ossrhUsername and ossrhPassword.')
        }
        if (!repositoryKey) {
            throw new GradleException('centralStagingRepositoryKey is required.')
        }

        def endpoint = "https://ossrh-staging-api.central.sonatype.com/manual/drop/repository/${repositoryKey}"
        def connection = new URL(endpoint).openConnection() as HttpURLConnection
        def token = "${username}:${password}".getBytes('UTF-8').encodeBase64().toString()
        connection.connectTimeout = 30000
        connection.readTimeout = 30000
        connection.requestMethod = 'DELETE'
        connection.setRequestProperty('Authorization', "Bearer ${token}")

        def status = connection.responseCode
        def stream = status >= 400 ? connection.errorStream : connection.inputStream
        def response = stream ? stream.getText('UTF-8') : ''
        if (status < 200 || status >= 300) {
            throw new GradleException("Central Portal staging drop failed (HTTP ${status}): ${response}")
        }
        println "Central Portal staging repository dropped: ${repositoryKey}"
    }
}

// TODO Migrate off this hand-rolled bundle/upload code to the "com.vanniktech.maven.publish"
//  plugin. It talks to the same native Central Publisher API these tasks reimplement here
//  (bundling, checksums, signing, upload, auto-release), but as a maintained plugin instead
//  of custom curl/HttpURLConnection scripting. Migrating is a real priority, not a
//  someday-cleanup item.
//  https://vanniktech.github.io/gradle-maven-publish-plugin/central/

def centralBundleDir = layout.buildDirectory.dir('central-bundle')
def centralBundleFile = layout.buildDirectory.file("distributions/gdx-lml-${libVersion}-central.zip")

task prepareCentralBundle {
    group 'gdx-lml'
    description 'Create a signed, checksummed Maven-layout bundle for the Central Publisher API.'
    dependsOn { allLibModules.collect { it.tasks.getByName('signMavenJavaPublication') } }

    doLast {
        def stagingDir = centralBundleDir.get().asFile
        delete stagingDir
        stagingDir.mkdirs()

        allLibModules.each { module ->
            def publication = module.publishing.publications.mavenJava
            def artifactDir = new File(stagingDir, "${publication.groupId.replace('.', '/')}/${publication.artifactId}/${publication.version}")
            artifactDir.mkdirs()
            def copyFile = { File source, String name ->
                copy {
                    from source
                    into artifactDir
                    rename { name }
                }
                def signature = new File(source.absolutePath + '.asc')
                if (!signature.isFile()) {
                    throw new GradleException("Missing signature for ${source}")
                }
                copy {
                    from signature
                    into artifactDir
                    rename { "${name}.asc" }
                }
            }

            publication.artifacts.each { artifact ->
                def classifier = artifact.classifier ? "-${artifact.classifier}" : ''
                copyFile(artifact.file, "${publication.artifactId}-${publication.version}${classifier}.${artifact.extension}")
            }

            def pom = module.layout.buildDirectory.file('publications/mavenJava/pom-default.xml').get().asFile
            copyFile(pom, "${publication.artifactId}-${publication.version}.pom")
            def moduleMetadata = module.layout.buildDirectory.file('publications/mavenJava/module.json').get().asFile
            if (moduleMetadata.isFile()) {
                copyFile(moduleMetadata, "${publication.artifactId}-${publication.version}.module")
            }
        }

        fileTree(stagingDir).matching { exclude '**/*.md5', '**/*.sha1', '**/*.sha256', '**/*.sha512' }.files.each { file ->
            ['MD5': 'md5', 'SHA-1': 'sha1', 'SHA-256': 'sha256', 'SHA-512': 'sha512'].each { algorithm, extension ->
                def digest = java.security.MessageDigest.getInstance(algorithm).digest(file.bytes).encodeHex().toString()
                new File(file.parentFile, "${file.name}.${extension}").text = digest
            }
        }

        def bundle = centralBundleFile.get().asFile
        bundle.parentFile.mkdirs()
        ant.zip(destfile: bundle, basedir: stagingDir)
        println "Central bundle created: ${bundle}"
    }
}

task uploadCentralBundle {
    group 'gdx-lml'
    description 'Upload the prepared bundle to Central and automatically release it after validation.'
    dependsOn prepareCentralBundle

    doLast {
        def username = findProperty('ossrhUsername')
        def password = findProperty('ossrhPassword')
        if (!username || !password) {
            throw new GradleException('Central Portal user-token credentials are required: ossrhUsername and ossrhPassword.')
        }
        def bundle = centralBundleFile.get().asFile
        def name = java.net.URLEncoder.encode("gdx-lml-${libVersion}", 'UTF-8')
        def token = "${username}:${password}".getBytes('UTF-8').encodeBase64().toString()
        def response = new ByteArrayOutputStream()
        def curlConfig = """url = \"https://central.sonatype.com/api/v1/publisher/upload?name=${name}&publishingType=AUTOMATIC\"
header = \"Authorization: Bearer ${token}\"
form = \"bundle=@${bundle.absolutePath};type=application/octet-stream\"
"""
        def result = exec {
            executable 'curl'
            args '--config', '-', '--fail-with-body', '--silent', '--show-error', '--connect-timeout', '30', '--max-time', '180'
            standardInput = new ByteArrayInputStream(curlConfig.getBytes('UTF-8'))
            standardOutput = response
            errorOutput = response
            ignoreExitValue = true
        }
        if (result.exitValue != 0) {
            throw new GradleException("Central bundle upload failed: ${response.toString('UTF-8').trim()}")
        }
        def deploymentId = response.toString('UTF-8').trim()
        file("${buildDir}/central-deployment-id.txt").text = deploymentId
        println "Central deployment accepted: ${deploymentId}"
    }
}

// Central's OSSRH staging compatibility API stalled repeatedly for this project.
// Keep task names as explicit safeguards so a future release cannot accidentally use it.
publishAll.setDependsOn([])
publishAll.description = 'Disabled: use uploadCentralBundle for Central releases.'
publishAll.doLast {
    throw new GradleException('publishAll is disabled. Use uploadCentralBundle instead.')
}

task publishAllSnapshots {
    group 'gdx-lml'
    description 'Publish all the Maven artifacts to the public repos.' +
            'This task will only be execute if the current version is a snapshot.'

    allLibModules.forEach {project ->
        dependsOn project.build
        dependsOn project.publishSnapshot
    }
}

task installAll {
    group 'gdx-lml'
    description 'Installs all the Maven artifacts to the local Maven repo.'

    allLibModules.forEach {project ->
        dependsOn project.build
        dependsOn project.publishToMavenLocal
    }
}

apply from: 'gradle/github-release.gradle'

githubReleaseDraft {
    githubRepository = 'crashinvaders/gdx-lml'
    mavenGroup = projectGroup
    artifactIds = allLibModules.collect { it.findProperty('projectName') }.sort()
    artifactExtensions = libAndroidModules.collectEntries { [(it.findProperty('projectName')): 'aar'] }
    releaseTitle = { metadata -> metadata.tag }
}
